<html lang="ko">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@300;500;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --brand-violet: #7c3aed;
      --brand-rose:   #ec4899;
      --brand-coral:  #f97316;
      --brand-mint:   #10b981;
      --bg:        #faf7ff;
      --bg-soft:   #f3eeff;
      --bg-card:   #ffffff;
      --border:    #e5deff;
      --border-md: #d4c8ff;

    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);}
    .brand{font-family:'Gmarket Sans','Noto Sans KR',sans-serif;}

    .lobby{min-height:100svh;background:linear-gradient(145deg,#fdf4ff 0%,#f0e9ff 40%,#fce7f3 100%);display:flex;align-items:center;justify-content:center;padding:1.5rem;position:relative;overflow:hidden;}

    .lobby::after{content:'';position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(244,114,182,.14) 0%,transparent 70%);bottom:-80px;left:-60px;}
    .lobby-card{width:100%;max-width:460px;position:relative;z-index:2;background:rgba(255,255,255,.82);border:1.5px solid var(--border-md);border-radius:2rem;padding:2.5rem 2rem;backdrop-filter:blur(20px);box-shadow:0 8px 40px rgba(124,58,237,.12),0 2px 0 rgba(255,255,255,.9) inset;}

    .lobby-title{font-family:'Gmarket Sans',sans-serif;font-size:2.1rem;font-weight:700;line-height:1;margin:.6rem 0 .3rem;background:linear-gradient(90deg,#7c3aed,#ec4899,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

    .lobby-input::placeholder{color:var(--text-muted);text-transform:none;font-weight:400;}
    .lobby-input:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.15);}
    .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:1.25rem;}
    .role-btn{height:6.5rem;border-radius:1.5rem;border:none;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.45rem;font-size:.88rem;font-weight:700;font-family:'Noto Sans KR',sans-serif;transition:transform .2s,box-shadow .2s;}

    .role-btn.teacher{background:linear-gradient(135deg,#6d28d9,#a78bfa);box-shadow:0 8px 24px rgba(109,40,217,.3);}

    .lobby-tip{font-size:.65rem;color:var(--text-muted);text-align:center;margin-top:1rem;line-height:1.9;}
    .teacher-wrap{min-height:100svh;background:linear-gradient(160deg,#f5f0ff 0%,#fdf4ff 50%,#fef3f2 100%);display:flex;flex-direction:column;padding:.9rem 1.1rem;}
    .t-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid var(--t-border);padding-bottom:.7rem;margin-bottom:.75rem;gap:.5rem;flex-wrap:wrap;}
    .t-label{font-family:'Gmarket Sans',sans-serif;font-size:.63rem;font-weight:700;letter-spacing:.09em;background:linear-gradient(90deg,#7c3aed,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .t-title{font-family:'Gmarket Sans',sans-serif;font-size:1.3rem;font-weight:700;color:var(--t-text);}
    .t-header-right{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}

    .qr-inner{padding:1.1rem;display:flex;flex-direction:column;align-items:center;gap:.8rem;}

    .room-code-box{width:100%;background:linear-gradient(135deg,#ede9fe,#fce7f3);border:2px dashed #c4b5fd;border-radius:1.25rem;padding:1.1rem;display:flex;flex-direction:column;align-items:center;gap:.5rem;}

    .stats-head{font-size:.62rem;font-weight:700;color:var(--t-muted);letter-spacing:.07em;text-transform:uppercase;}
    .stat-row{display:flex;flex-direction:column;gap:.2rem;}

    .tube-glass{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);width:38px;height:350px;background:rgba(255,255,255,.5);border:2.5px solid rgba(167,139,250,.35);border-radius:19px 19px 0 0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:inset 0 2px 8px rgba(124,58,237,.08),0 0 0 1px rgba(255,255,255,.8);}

    .tube-layer{width:100%;transition:height 1.2s cubic-bezier(.34,1.4,.64,1);position:relative;overflow:hidden;}

    .bulb-inner{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.35rem;}
    .reason-bubbles-wrap{position:absolute;top:0;left:0;right:0;bottom:50px;pointer-events:none;overflow:hidden;}

    .avg-label{font-size:.65rem;font-weight:700;letter-spacing:.06em;color:var(--t-muted);}

    .avg-desc{font-size:.75rem;color:var(--t-sub);line-height:1.7;}
    .feed-card{background:var(--t-card);border:1.5px solid var(--t-border);border-radius:1.5rem;padding:1.1rem;display:flex;flex-direction:column;min-height:0;box-shadow:0 2px 12px rgba(124,58,237,.06);}
    .feed-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid var(--t-border);padding-bottom:.6rem;margin-bottom:.7rem;flex-shrink:0;}
    .feed-head-title{font-size:.88rem;font-weight:700;color:var(--t-text);}

    .feed-list::-webkit-scrollbar-thumb{background:#ddd4f8;border-radius:3px;}

    .feed-empty{text-align:center;color:#c4b5fd;padding:2rem 1rem;font-size:.78rem;line-height:2;}
    .t-footer{margin-top:.7rem;padding:.8rem 1.1rem;background:#f5f0ff;border:1.5px solid #ddd4f8;border-radius:1.1rem;font-size:.7rem;color:var(--t-muted);line-height:1.7;flex-shrink:0;}
    .t-footer strong{color:#7c3aed;}
    .student-wrap{min-height:100svh;background:linear-gradient(160deg,#fdf4ff 0%,#f0e9ff 50%,#fce7f3 100%);display:flex;align-items:center;justify-content:center;padding:1rem;position:relative;overflow:hidden;}
    .student-wrap::before{content:'';position:fixed;top:-60px;right:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.2) 0%,transparent 70%);pointer-events:none;}
    .student-wrap::after{content:'';position:fixed;bottom:-60px;left:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(244,114,182,.16) 0%,transparent 70%);pointer-events:none;}
    .student-card{width:100%;max-width:420px;position:relative;z-index:2;background:rgba(255,255,255,.92);border:1.5px solid #ddd4f8;border-radius:2rem;padding:1.5rem;box-shadow:0 12px 48px rgba(124,58,237,.12),0 2px 0 rgba(255,255,255,.9) inset;backdrop-filter:blur(12px);}

    .s-top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;}
    .s-badge{background:linear-gradient(90deg,#ede9fe,#fce7f3);border:1px solid #d8b4fe;color:#7c3aed;}
    .s-project-name{font-family:'Gmarket Sans',sans-serif;font-size:1.55rem;font-weight:700;background:linear-gradient(90deg,#7c3aed,#ec4899,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .s-subtitle{font-size:.78rem;color:var(--text-sub);margin-top:.15rem;line-height:1.6;}
    .emo-btn{width:100%;padding:.75rem .9rem;border-radius:1.1rem;border:1.5px solid #ede9fe;background:#fdf9ff;cursor:pointer;text-align:left;display:flex;align-items:center;gap:.7rem;margin-bottom:.45rem;transition:.2s;color:var(--text);}
    .emo-btn:hover{background:#f5eeff;border-color:#c4b5fd;}
    .emo-btn.selected{border-color:var(--sel-color);background:var(--sel-bg);transform:scale(1.01);box-shadow:0 4px 16px rgba(0,0,0,.08);}

    .emo-name{font-weight:800;font-size:.83rem;color:var(--text);}
    .emo-desc{font-size:.67rem;color:var(--text-muted);margin-top:.08rem;}
    .selected-badge{margin-left:auto;font-size:.58rem;font-weight:700;padding:.2rem .55rem;border-radius:999px;flex-shrink:0;color:#fff;}
    .reason-area{border-radius:1.1rem;border:1.5px solid;padding:.9rem;margin-top:.25rem;transition:.3s;}

<body>
<div id="root"></div>
<script>
// ════════════════════════════════════════════════
//  🔥 Firebase Realtime DB 설정
//  ★ 아래 URL을 본인의 Firebase DB URL로 교체하세요 ★
//  Firebase 콘솔(console.firebase.google.com) →
//  Realtime Database → 상단에 표시된 URL 복사 후 붙여넣기
// ════════════════════════════════════════════════
const DB_URL = 'https://mind-on-ac92f-default-rtdb.firebaseio.com';

// Firebase REST API 함수들
async function dbRead(room) {
  try {
    const res = await fetch(`${DB_URL}/rooms/${room}/responses.json`);
    if (!res.ok) return [];
    const data = await res.json();
    if (!data) return [];
    return Object.values(data);
  } catch { return []; }
}

async function dbPush(room, response) {
  try {
    await fetch(`${DB_URL}/rooms/${room}/responses/${response.id}.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(response)
    });
  } catch(e) { console.warn('저장 실패:', e); }
}

async function dbClear(room) {
  try {
    await fetch(`${DB_URL}/rooms/${room}/responses.json`, { method: 'DELETE' });
  } catch(e) { console.warn('초기화 실패:', e); }
}

// 로컬 백업 (같은 기기 탭 간 동기화용)
const STORE_KEY = r => `maum_on_${r}`;
function loadRes(r) { try { return JSON.parse(localStorage.getItem(STORE_KEY(r)) || '[]') } catch { return [] } }
function saveRes(r, d) { localStorage.setItem(STORE_KEY(r), JSON.stringify(d)) }

// ════════════════════════════════════════════════

  { value:40, label:'매우 화남', color:'#ea580c', bg:'#fff4ee', border:'#fed7aa', selBg:'#fff0e6', emoji:'🔥', desc:'속이 뜨겁고 붉은 불길처럼 화가 나요' },
  { value:30, label:'기쁨',     color:'#d97706', bg:'#fffbeb', border:'#fde68a', selBg:'#fff8e1', emoji:'😄', desc:'햇살처럼 밝고 기분 좋은 설렘이 있어요' },
  { value:20, label:'평온함',   color:'#0d9488', bg:'#f0fdfa', border:'#99f6e4', selBg:'#eafaf7', emoji:'😌', desc:'맑은 호수처럼 편안하고 안정적이에요' },
  { value:10, label:'지루함',   color:'#16a34a', bg:'#f0fdf4', border:'#bbf7d0', selBg:'#e8fced', emoji:'😑', desc:'새싹처럼 조용하고 아직 흥미가 안 나요' },
  { value: 0, label:'불안',     color:'#2563eb', bg:'#eff6ff', border:'#bfdbfe', selBg:'#e6f0ff', emoji:'😰', desc:'깊은 바다속처럼 마음이 차갑고 떨려요' },
];
const getEmo = v => EMOTIONS.find(e => e.value === v) || EMOTIONS[2];
function tempColor(t) { if(t>=35) return '#ea580c'; if(t>=25) return '#d97706'; if(t>=15) return '#0d9488'; if(t>=5) return '#16a34a'; return '#2563eb'; }

// URL 파라미터
function getParams() { const p = new URLSearchParams(location.search); return { role: p.get('role'), room: (p.get('room')||'').toUpperCase() }; }
function setUrl(role, room) { history.replaceState({}, '', `${location.pathname}?role=${role}&room=${room}`); }

const ROOT = document.getElementById('root');

//  렌더링

function render() {

  bind();
}

// ════════════════════════════════════════════════
//  이벤트 바인딩
// ════════════════════════════════════════════════
function bind() {
  if (!S.role) {
    document.getElementById('roomInput')?.addEventListener('input', e => { S.roomInput = e.target.value.toUpperCase(); });
    document.getElementById('btn-teacher')?.addEventListener('click', () => goRole('teacher'));
    document.getElementById('btn-student')?.addEventListener('click', () => goRole('student'));
  }
  if (S.role === 'student' && !S.room) {
    const ji = document.getElementById('joinInput');
    const jb = document.getElementById('btn-join');
    ji?.addEventListener('input', e => {
      S.joinInput = e.target.value.toUpperCase();
      if (jb) jb.disabled = !e.target.value.trim();
    });
    jb?.addEventListener('click', () => {
      const room = S.joinInput.trim().toUpperCase();
      if (!room) return;
      S.room = room; S.joinInput = '';
      setUrl('student', room);
      initSync();
      render();
    });
    ji?.addEventListener('keydown', e => { if (e.key === 'Enter' && S.joinInput.trim()) jb?.click(); });
    document.getElementById('btn-back')?.addEventListener('click', () => { S.role = null; render(); });
    return;
  }
  if (S.role === 'teacher') {
    document.getElementById('btn-reset')?.addEventListener('click', doReset);
  }
  if (S.role === 'student' && S.room) {
    document.querySelectorAll('.emo-btn').forEach(b => b.addEventListener('click', () => { S.selTemp = +b.dataset.temp; render(); }));
    document.getElementById('reasonInput')?.addEventListener('input', e => {
      S.reason = e.target.value;
      const fc = document.querySelector('.reason-footer span:last-child');
      if (fc) fc.textContent = `${e.target.value.length}/50자`;
      const sb = document.getElementById('btn-submit');
      if (sb) sb.disabled = !e.target.value.trim();
    });
    document.getElementById('btn-submit')?.addEventListener('click', doSubmit);
    document.getElementById('btn-again')?.addEventListener('click', () => { S.ok = false; render(); });
    document.getElementById('btn-back')?.addEventListener('click', () => { S.role = null; S.room = ''; render(); });
  }
}

// ════════════════════════════════════════════════
//  액션
// ════════════════════════════════════════════════
function goRole(role) {
  const ri = document.getElementById('roomInput');
  const rv = (ri?.value || S.roomInput || '').trim().toUpperCase();
  if (role === 'teacher') {
    const room = rv || ('ON-' + Math.floor(1000 + Math.random() * 9000));
    S.room = room; S.role = role;
    setUrl(role, room); initSync(); render();
  } else {
    S.role = 'student'; S.room = ''; S.joinInput = rv;
    render();
  }
}

async function doReset() {
  if (!confirm('모든 응답을 초기화하시겠습니까?')) return;
  S.responses = []; S.bubbles = [];
  saveRes(S.room, []);
  await dbClear(S.room);
  if (ch) ch.postMessage({ type: 'RESET' });
  render();
}

async function doSubmit() {
  const r = S.reason.trim(); if (!r) return;
  const sb = document.getElementById('btn-submit');
  if (sb) { sb.disabled = true; sb.innerHTML = '전송 중...'; }
  const res = {
    id: Date.now() + '_' + Math.floor(Math.random() * 9999),
    temp: S.selTemp, reason: r,
    timestamp: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
  };
  S.responses = [...S.responses, res];
  saveRes(S.room, S.responses);
  await dbPush(S.room, res);           // 🔥 Firebase에 저장 → 교사 화면에 2초 내 반영
  if (ch) ch.postMessage({ type: 'NEW', payload: res });
  S.reason = ''; S.ok = true; render();
}

// ════════════════════════════════════════════════
//  실시간 동기화
// ════════════════════════════════════════════════
function initSync() {
  if (ch) { ch.close(); ch = null; }
  if (si) { clearInterval(si); si = null; }
  const { room } = S; if (!room) return;

  // 로컬 초기 로드
  S.responses = loadRes(room);

  // BroadcastChannel: 같은 기기 탭 간 즉시 동기화
  try {
    ch = new BroadcastChannel(`maum_on_${room}`);
    ch.onmessage = ev => {
      if (ev.data.type === 'NEW') {
        const r = ev.data.payload;
        if (S.responses.some(x => x.id === r.id)) return;
        S.responses = [...S.responses, r];
        saveRes(room, S.responses);
        if (S.role === 'teacher') { addBubble(r); render(); }
      } else if (ev.data.type === 'RESET') {
        S.responses = []; S.bubbles = []; saveRes(room, []); render();
      }
    };
  } catch(e) { ch = null; }

  // 🔥 Firebase 폴링: 다른 기기(학생 폰 ↔ 교사 PC) 간 2초마다 동기화
  si = setInterval(async () => {
    const fr = await dbRead(room);
    const newItems = fr.filter(r => !S.responses.some(x => x.id === r.id));
    const removed = S.responses.length > fr.length;
    if (newItems.length > 0 || removed) {
      S.responses = fr;
      saveRes(room, fr);
      if (newItems.length > 0) newItems.forEach(r => addBubble(r));
      render();
    }
  }, 2000);

  // 첫 진입 시 Firebase에서 즉시 최신 데이터 로드
  dbRead(room).then(fr => {
    if (fr.length > 0) { S.responses = fr; saveRes(room, fr); render(); }
  });
}

function addBubble(res) {
  const e = getEmo(res.temp);
  const b = { id: res.id, text: res.reason.length > 18 ? res.reason.slice(0,18)+'…' : res.reason, color: e.color, delay: Math.random()*.8, left: 12 + Math.random()*70 };
  S.bubbles = [...S.bubbles.slice(-8), b];
  setTimeout(() => { S.bubbles = S.bubbles.filter(x => x.id !== b.id); }, 8000);
}

// 초기 실행
(() => {
  const { role, room } = getParams();
  if (role && room) { S.role = role; S.room = room; initSync(); }
  else if (role === 'student') { S.role = 'student'; S.room = ''; }
  render();
})();
</script>
